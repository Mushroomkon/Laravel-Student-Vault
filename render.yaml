services:
  - type: web
    name: laravel-student-vault
    env: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: student-vault-db
          property: connectionString

databases:
  - name: student-vault-db
    databaseName: student_vault
    user: student_vault
